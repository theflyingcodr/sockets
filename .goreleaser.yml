# Make sure to check the documentation at http://goreleaser.com
version: 2
# ---------------------------
# GENERAL
# ---------------------------
snapshot:
  version_template: "{{ .Tag }}"
changelog:
  sort: asc
  filters:
    exclude:
      - '^.github:'
      - '^test:'

# ---------------------------
# BUILDER
# ---------------------------
# A library: nothing to build or archive, the release is the tag and changelog.
builds:
  - skip: true
checksum:
  name_template: 'checksums.txt'
# ---------------------------
# Github Release
# ---------------------------
release:
  prerelease: true
  name_template: "Release v{{.Version}}"
